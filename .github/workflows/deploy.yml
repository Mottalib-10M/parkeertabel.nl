name: Open Data Parkeren update and deploy

# Elke maandag om 6 uur (Nederlandse tijd) en op 1 en 2 januari (nieuwe tarieven) : scripts/update-data.sh leest
# Open Data Parkeren (RDW, Nationaal Parkeer Register, CC0) opnieuw en schrijft src/data/npr/ en public/data/geo/
# (tarieven die vandaag gelden) ; daarna wordt de site opnieuw gebouwd en gepubliceerd.
# Ce workflow est le seul qui publie le site : push sur main, tâche planifiée et lancement manuel.
# Modèle : canadaprocessingtimes.com/.github/workflows/update-data.yml (RECETTE, sites à données datées).
on:
  schedule:
    - cron: "0 5 * * 1"
    - cron: "0 5 1,2 1 *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read Open Data Parkeren (scheduled and manual runs)
        if: github.event_name != 'push'
        run: npm run update-data

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit the new readings
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/npr/ public/data/geo/
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Open Data Parkeren gelezen op $(date -u +%F)" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
        uses: actions/checkout@v4
      - name: Ping IndexNow
        if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://parkeertabel.nl
